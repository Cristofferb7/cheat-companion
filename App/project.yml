# Generate the Xcode project with: xcodegen generate --spec App/project.yml
# (requires Xcode installed; see README)
name: CheatCompanion
options:
  bundleIdPrefix: com.cristoffer
  deploymentTarget:
    iOS: "17.0"
packages:
  CheatKit:
    path: ..
targets:
  CheatCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: ../data/games
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CheatKit
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Cheat Companion
        # Required for canOpenURL(delta://) checks
        LSApplicationQueriesSchemes: [delta]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
